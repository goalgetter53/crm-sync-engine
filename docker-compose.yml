# Local stack: Postgres warehouse + fake HubSpot + the sync engine.
#   docker compose up -d postgres fake-hubspot
#   docker compose run --rm sync demo-seed --contacts 2000
#   docker compose run --rm sync plan examples/mapping.yaml
#   docker compose run --rm sync apply examples/mapping.yaml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d warehouse"]
      interval: 2s
      retries: 20

  fake-hubspot:
    build: .
    entrypoint: ["fake-hubspot"]
    command: ["--host", "0.0.0.0", "--port", "8090", "--rate-limit", "100", "--search-delay-ms", "2000"]
    ports: ["8090:8090"]

  sync:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      fake-hubspot: { condition: service_started }
    environment:
      WAREHOUSE_URL: postgresql+psycopg://crm:crm@postgres:5432/warehouse
      STATE_URL: postgresql+psycopg://crm:crm@postgres:5432/warehouse
      HUBSPOT_BASE_URL: http://fake-hubspot:8090
      HUBSPOT_ACCESS_TOKEN: local-dev-token
    profiles: ["cli"]
