[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "crm-sync-engine"
version = "0.1.0"
description = "Bi-directional reverse-ETL sync engine between a SQL warehouse and HubSpot CRM, with declarative mappings, three-way merge and convergence guarantees."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hussain Singapuri" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
fake = ["fastapi>=0.110", "uvicorn>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "crm-sync-engine[fake]",
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
crm-sync = "crm_sync.cli:main"
fake-hubspot = "fake_hubspot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_sync", "src/fake_hubspot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer property-based runs"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using .httpx. with .starlette.testclient.:Warning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET"]
ignore = ["RET504", "PT011", "N818"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["crm_sync", "fake_hubspot"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true
